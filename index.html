<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger-book app — a fixed index rail on the left (top tabs on phones), working pages on the right. */
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --sunk: #E7EDE9;
  --ink: #16251E;
  --muted: #5B6C64;
  --line: #D3DDD7;
  --accent: #1D6A54;
  --accent-soft: #DCEDE6;
  --accent-ink: #FFFFFF;
  --marigold: #B97C0C;
  --marigold-soft: #F7ECD5;
  --good: #2B7A3D;
  --bad: #B3412D;
  --bad-soft: #F6E1DC;
  --shadow: 0 1px 2px rgba(22,37,30,.06), 0 8px 24px rgba(22,37,30,.06);
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1713; --surface: #16211C; --sunk: #0B120E; --ink: #E2ECE6; --muted: #92A69B;
    --line: #283830; --accent: #52B496; --accent-soft: #173A2F; --accent-ink: #07130E;
    --marigold: #E2AC45; --marigold-soft: #3A2E14; --good: #62BE77; --bad: #E58069; --bad-soft: #3D1F18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1713; --surface: #16211C; --sunk: #0B120E; --ink: #E2ECE6; --muted: #92A69B;
  --line: #283830; --accent: #52B496; --accent-soft: #173A2F; --accent-ink: #07130E;
  --marigold: #E2AC45; --marigold-soft: #3A2E14; --good: #62BE77; --bad: #E58069; --bad-soft: #3D1F18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
.num, td.amt, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.2; }
.brand-sub { color: var(--muted); font-size: .75rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 10px; }
.nav button svg { width: 17px; height: 17px; flex: none; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.rail-foot { margin-top: auto; font-size: .75rem; color: var(--muted); padding: 0 8px; }
.rail-foot .status { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--good); }
.dot.demo { background: var(--marigold); }

.main { min-width: 0; padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1240px; width: 100%; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.head p { margin: 4px 0 0; color: var(--muted); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.banner { border-radius: 9px; padding: 10px 14px; background: var(--marigold-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--marigold) 35%, transparent); font-size: .875rem; }
.banner strong { color: var(--marigold); }

.btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 7px; font-weight: 600; font-size: .875rem; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.seg { display: inline-flex; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 6px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg button:focus-visible { outline: 2px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head .note { color: var(--muted); font-size: .8rem; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi .value { font-family: var(--f-mono); font-size: 1.45rem; font-weight: 500; letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi .sub { font-size: .8rem; color: var(--muted); }
.kpi.lead { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.lead .label, .kpi.lead .sub { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; }
.grid-2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .k { min-width: 0; overflow-wrap: anywhere; }
.row .k small { display: block; color: var(--muted); font-size: .76rem; }
.row .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.total { border-top: 1.5px solid var(--ink); border-bottom: 0; font-weight: 700; margin-top: 4px; }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-line { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .84rem; }
.bar-line .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 9px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 5px; }
.fill.warn { background: var(--marigold); }
.fill.over { background: var(--bad); }
.bar-line .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); }

.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--f-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 16px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 10px 14px; background: var(--sunk); white-space: nowrap; }
td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
td.amt, th.amt { text-align: right; white-space: nowrap; }
td .sub { color: var(--muted); font-size: .76rem; }
tfoot td { font-weight: 700; background: var(--sunk); }
.in { color: var(--good); }
.out { color: var(--bad); }
.xfer { color: var(--muted); }

.chip { display: inline-block; font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.fcra { background: var(--marigold-soft); color: var(--marigold); }
.chip.ex { background: transparent; border: 1px dashed var(--line); }
.chip.good { background: var(--accent-soft); color: var(--accent); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--marigold-soft); color: var(--marigold); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input, .filters select { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .76rem; font-weight: 600; color: var(--muted); }
.field small { color: var(--muted); font-size: .75rem; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="email"], input[type="tel"], input[type="password"], input[type="month"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%;
}
.filters input, .filters select { width: auto; }
.filters input[type="search"] { flex: 1 1 200px; }
textarea { resize: vertical; min-height: 90px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; }
.check input { margin-top: 3px; accent-color: var(--accent); }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h2 { color: var(--ink); }
.empty p { max-width: 44ch; margin: 0; }

.overlay { position: fixed; inset: 0; background: rgba(8,16,12,.45); display: flex; justify-content: center; align-items: flex-start; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; width: min(640px, 100%); box-shadow: var(--shadow); border: 1px solid var(--line); margin-block: auto; }
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { display: flex; justify-content: space-between; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal-foot .right { display: flex; gap: 8px; margin-left: auto; }

.receipt { border: 1.5px solid var(--ink); border-radius: 4px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
.receipt .r-org { text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.receipt .r-org h2 { font-size: 1.25rem; }
.receipt .r-org div { color: var(--muted); font-size: .8rem; }
.receipt .r-title { text-align: center; font-family: var(--f-display); letter-spacing: .14em; text-transform: uppercase; font-size: .82rem; font-weight: 700; }
.receipt dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; font-size: .88rem; }
.receipt dt { color: var(--muted); }
.receipt dd { margin: 0; overflow-wrap: anywhere; }
.receipt .r-amt { font-family: var(--f-mono); font-size: 1.3rem; }
.receipt .r-words { font-style: italic; }
.receipt .r-foot { display: flex; justify-content: space-between; gap: 16px; font-size: .78rem; color: var(--muted); padding-top: 18px; flex-wrap: wrap; }
.receipt .sign { border-top: 1px solid var(--muted); padding-top: 4px; min-width: 140px; text-align: center; }

.field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field-top label { font-size: .76rem; font-weight: 600; color: var(--muted); }
.link-btn { all: unset; cursor: pointer; color: var(--accent); font-size: .78rem; font-weight: 600; border-radius: 4px; padding: 0 2px; }
.link-btn:hover { text-decoration: underline; }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.quick-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--sunk); border-radius: 9px; padding: 10px; margin-top: 14px; }
.quick-add select, .quick-add input { width: auto; }
.quick-add input { flex: 1 1 180px; min-width: 0; }
.lock-btn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: .82rem; border: 1px solid var(--line); color: var(--muted); }
.lock-btn svg { width: 16px; height: 16px; flex: none; }
.lock-btn:hover { border-color: var(--muted); color: var(--ink); }
.lock-btn:focus-visible { outline: 2px solid var(--accent); }
.lock-btn.entry { background: var(--marigold-soft); color: var(--marigold); border-color: transparent; }
.lock-btn.admin { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.lock-btn small { font-weight: 500; opacity: .8; }
#lock-root .overlay { z-index: 70; }
.pw-err { color: var(--bad); font-size: .82rem; min-height: 1.2em; margin: 0; }
.recovery { font-family: var(--f-mono); font-size: 1.35rem; letter-spacing: .08em; text-align: center; padding: 14px; border: 1.5px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); color: var(--accent); user-select: all; overflow-wrap: anywhere; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.levels div { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: .82rem; color: var(--muted); }
.levels strong { display: block; color: var(--ink); font-size: .86rem; margin-bottom: 2px; }
@media (max-width: 820px) { .lock-btn { padding: 6px 9px; } .lock-btn .lb-text { display: none; } .levels { grid-template-columns: minmax(0, 1fr); } }
.audit { border-top: 1px solid var(--line); padding-top: 12px; font-size: .82rem; color: var(--muted); }
.audit summary { cursor: pointer; }
.audit summary strong, .audit li strong { color: var(--ink); font-weight: 600; }
.audit ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.role-note { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.muted { color: var(--muted); }
.right { text-align: right; }
.loading { padding: 80px 20px; text-align: center; color: var(--muted); font-family: var(--f-display); font-size: 1.05rem; }

@media (max-width: 1050px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-2e { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); gap: 12px; z-index: 20; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .brand-text, .rail-foot { display: none; }
  .brand { padding: 0; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .nav button { padding: 7px 10px; white-space: nowrap; }
  .nav button svg { display: none; }
  .main { padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 520px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .kpi .value { font-size: 1.2rem; }
  .bar-line { grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr) auto; }
}
/* Monthly report: an A4 sheet, always black on white like the printout */
.paper { background: #fff; color: #15201b; border: 1px solid var(--line); border-radius: 4px; padding: 28px 30px; font-size: 12px; line-height: 1.45; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.paper h2 { font-size: 1.25rem; color: #15201b; }
.paper h3 { font-family: var(--f-display); font-size: .92rem; margin: 6px 0 0; color: #15201b; border-bottom: 1.5px solid #15201b; padding-bottom: 4px; }
.paper .p-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid #15201b; padding-bottom: 12px; }
.paper .p-head .meta { color: #4b5a53; font-size: 11px; }
.paper .p-title { text-align: right; }
.paper .p-kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #1d6a54; }
.paper .p-month { font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; }
.paper .p-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #15201b; }
.paper .p-sum div { padding: 8px 10px; border-left: 1px solid #c9d3ce; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.paper .p-sum div:first-child { border-left: 0; }
.paper .p-sum div > span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #4b5a53; font-weight: 600; }
.paper .p-sum strong { font-family: var(--f-mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.paper .p-note { margin: 0; color: #4b5a53; }
.paper table { font-size: 11px; }
.paper th { background: #eef2f0; color: #4b5a53; padding: 5px 8px; font-size: 9.5px; }
.paper td { padding: 4px 8px; border-top: 1px solid #dfe5e2; color: #15201b; }
.paper td.amt, .paper th.amt { font-family: var(--f-mono); }
.paper tfoot td { background: #eef2f0; font-weight: 700; border-top: 1.5px solid #15201b; }
.paper .p-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.paper .p-wrap { overflow-x: auto; }
.paper .p-sign { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; padding-top: 34px; }
.paper .p-sign div { border-top: 1px solid #15201b; padding-top: 4px; text-align: center; font-size: 10.5px; color: #4b5a53; }
.paper .p-gen { color: #7a8781; font-size: 9.5px; text-align: right; }
.paper .neg { color: #a33a26; }
.paper.rcpt { gap: 12px; position: relative; font-size: 12.5px; }
.rcpt .rc-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid #15201b; padding-bottom: 10px; }

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);

}
async function resolveNames() {
  if (!userCap) return;
  const ids = new Set();
  for (const x of [...S.allTxs, ...S.allDonors]) { [x.createdBy, x.updatedBy, x.deletedBy].forEach(i => i && ids.add(i)); (x.history || []).forEach(h => h.by && ids.add(h.by)); }
  if (S.settings.updatedBy) ids.add(S.settings.updatedBy);
  S.customCats.forEach(c => c.createdBy && ids.add(c.createdBy));
  Object.values(S.budgetMeta).forEach(m => m.by && ids.add(m.by));
  const missing = [...ids].filter(i => i !== S.me && !(i in S.names));
  if (!missing.length) return;
  missing.forEach(i => S.names[i] = "");
  for (let i = 0; i < missing.length; i += 64) {
    const chunk = missing.slice(i, i + 64);
    try { const ps = await userCap.profiles(chunk); for (const id of chunk) S.names[id] = ps?.[id]?.name || ""; } catch {}

/* ---------- passwords ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPw(pw, saltB64, iter = 150000) {
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, key, 256);

async function pwMatches(pw, rec) { if (!rec || !pw) return false; const h = await hashPw(pw, rec.salt, rec.iter); return h.hash === rec.hash; }

const normKey = k => String(k || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
let lastActive = Date.now(), pwFails = 0, pwWaitUntil = 0, unlockThen = null;
const LOCK_AFTER = 15 * 60 * 1000;

setInterval(() => {

}, 30000);
function setLevel(n) {

}
function requireLevel(need, then) {

function closeUnlock() { $("#lock-root").innerHTML = ""; unlockThen = null; }

      </div>

    : `<button class="btn ghost" data-act="pw-forgot" data-need="${need}">Forgot the admin password?</button><div class="right"><button class="btn" data-act="pw-cancel">Cancel</button><button class="btn primary" data-act="pw-submit" data-need="${need}">Unlock</button></div>`;

async function submitUnlock(need, btn) {

function pwProblem(a, e) {

}
async function storeSecurity(adminPw, entryPw, keepRecovery) {

// Reads the password boxes in Settings. Returns null when they're empty, {error} when they don't pass, or the security record to save.
async function pendingSecurity() {

  const a = v("#pw-a"), a2 = v("#pw-a2"), e = v("#pw-e"), e2 = v("#pw-e2");
  if (!a && !a2 && !e && !e2) return null;
  if (!pwOn()) {
    if (!a || !e) return { error: "Type both an admin password and an entry password." };
    if (a !== a2) return { error: "The two admin passwords don't match. Type them again." };
    if (e !== e2) return { error: "The two entry passwords don't match. Type them again." };
    const p = pwProblem(a, e); if (p) return { error: p };

  }
  if ((a || a2) && a !== a2) return { error: "The two admin passwords don't match. Type them again." };
  if ((e || e2) && e !== e2) return { error: "The two entry passwords don't match. Type them again." };
  if ((a && a.length < 6) || (e && e.length < 6)) return { error: "Each password needs at least 6 characters." };
  if (a && e && a === e) return { error: "Use two different passwords." };
  if (a && !e && await pwMatches(a, S.settings.security.entry)) return { error: "The admin password must be different from the entry password." };
  if (e && !a && await pwMatches(e, S.settings.security.admin)) return { error: "The entry password must be different from the admin password." };

async function submitPasswords(kind, btn) {
  const label = btn.innerHTML;
  const busy = () => { btn.disabled = true; btn.innerHTML = `<span class="spinner" aria-hidden="true"></span>Saving…`; };
  const done = () => { btn.disabled = false; btn.innerHTML = label; };
  try {
    if (kind === "setup" || kind === "change") {
      busy(); const p = await pendingSecurity(); done();
      if (!p) return toast(kind === "setup" ? "Type an admin password and an entry password first." : "Type a new admin password, a new entry password, or both.");
      if (p.error) return toast(p.error);

    } else if (kind === "new-key") {
      busy(); const key = newRecoveryKey();
      await saveSettings({ ...S.settings, security: { ...S.settings.security, recovery: await hashPw(normKey(key)) } }); done(); showRecoveryKey(key);
    } else if (kind === "off") {

/* ---------- data layer ---------- */
async function writeDoc(coll, id, data) {
  if (S.mode === "db") { await db.collection(coll).doc(id).set(data); return; }
  const arr = coll === "transactions" ? S.allTxs : S.allDonors;
  const i = arr.findIndex(x => x.id === id); const rec = { id, ...data };
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  motion.flash[id] = performance.now();
  splitData(); persist(); render();
}
async function saveRec(coll, all, fields, prefix, id, data) {
  const prev = strip(id ? all.find(x => x.id === id) : null);
  const doc = stamp(prev, data, fields);
  if (!doc) return false;
  const newId = id || uid(prefix); motion.scrollTo = newId;
  await writeDoc(coll, newId, doc); return newId;
}
async function softDelete(coll, all, fields, id) {
  const p = strip(all.find(x => x.id === id));
  await writeDoc(coll, id, stamp(p, { ...p, deleted: true, deletedBy: S.me || "", deletedAt: Date.now() }, fields, "deleted"));
}
async function restore(coll, all, fields, id) {
  const p = strip(all.find(x => x.id === id)); const { deleted, deletedBy, deletedAt, ...rest } = p;
  await writeDoc(coll, id, stamp(p, rest, fields, "restored"));
}
const saveTx = (id, data) => saveRec("transactions", S.allTxs, TX_FIELDS, "t", id, data);
const delTx = id => softDelete("transactions", S.allTxs, TX_FIELDS, id);
const restoreTx = id => restore("transactions", S.allTxs, TX_FIELDS, id);
const saveDonor = (id, data) => saveRec("donors", S.allDonors, DONOR_FIELDS, "d", id, data);
const delDonor = id => softDelete("donors", S.allDonors, DONOR_FIELDS, id);
const restoreDonor = id => restore("donors", S.allDonors, DONOR_FIELDS, id);
async function saveSettings(data) {
  data = { ...data, updatedBy: S.me || "", updatedAt: Date.now() };
  if (S.mode === "db") await db.doc("settings/main").set(data);
  else { S.settings = { ...DEFAULT_SETTINGS, ...data }; persist(); render(); }
}
async function saveBudget(fy, amounts) {
  const data = { fy, amounts, updatedBy: S.me || "", updatedAt: Date.now() };
  if (S.mode === "db") await db.collection("budgets").doc("fy" + fy).set(data);
  else { S.budgets[fy] = amounts; S.budgetMeta[fy] = { by: data.updatedBy, at: data.updatedAt }; persist(); render(); }
}
function writeFailed(e) {
  console.error(e);
  if (e && e.code === "invalid_argument") {
    if (S.view === "settings") { S.isOwner = false; render(); toast("Only the owner can change settings."); }
    else { S.canWrite = false; render(); toast("You can view these books but not change them. Ask the owner for Editor access."); }
  }
  else if (e && e.code === "quota_exceeded") toast("The ledger is full. Remove example data or old records in Settings.");
  else toast("Couldn't save. Check your connection and try again.");
}

async function boot() {
  S.mode = "demo"; S.me = "local";
  if (!loadLocal()) persist();
  render(); return;
  S.mode = "db";
  try { userCap = await claude.use("user"); } catch { userCap = null; }
  if (userCap) {
    try { S.me = await userCap.id(); } catch {}
    try { S.isOwner = await userCap.isOwner(); } catch {}
    try { if (await userCap.can("data.write") === false) S.canWrite = false; } catch {}
  }
  const onErr = e => { console.error(e); toast("Lost connection to the ledger. Reload the page to reconnect."); };
  db.collection("transactions").onSnapshot(snap => { const before = S.loaded.tx ? new Map(S.allTxs.map(t => [t.id, t.updatedAt || 0])) : null; S.allTxs = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (before) markChanged(before, S.allTxs); splitData(); S.loaded.tx = true; render(); resolveNames(); }, onErr);
  db.collection("donors").onSnapshot(snap => { const before = S.loaded.donors ? new Map(S.allDonors.map(t => [t.id, t.updatedAt || 0])) : null; S.allDonors = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (before) markChanged(before, S.allDonors); splitData(); S.loaded.donors = true; render(); resolveNames(); }, onErr);
  db.doc("settings/main").onSnapshot(snap => { S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) }; S.loaded.settings = true; render(); resolveNames(); }, onErr);
  db.collection("categories").onSnapshot(snap => { S.customCats = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); resolveNames(); }, onErr);
  db.collection("budgets").onSnapshot(snap => { const b = {}, m = {}; for (const d of snap.docs) { const x = d.data(); b[x.fy] = x.amounts || {}; m[x.fy] = { by: x.updatedBy || "", at: x.updatedAt || 0 }; } S.budgets = b; S.budgetMeta = m; render(); resolveNames(); }, onErr);
}

/* ---------- shell ---------- */
function renderShell() {

    lb.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/>${icon}</svg><span class="lb-text">${l === 2 ? "Admin" : l === 1 ? "Entry level" : "Locked"} <small>· ${l ? "Lock" : "Unlock"}</small></span>`;

}
function ready() { return S.mode === "demo" || (S.loaded.tx && S.loaded.settings && S.loaded.donors); }

let renderQueued = false;
function render() {
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}
function doRender() {
  renderShell();
  const main = $("#main");
  // Don't wipe a half-filled form when someone else's change arrives.
  const ae = document.activeElement;
  if (ready() && main.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && main.dataset.view === S.view) {
    if (S.view === "transactions") updateTxTable(); else S.pending = true;
    return;
  }
  main.dataset.view = S.view; S.pending = false;
  if (S.mode === "loading" || !ready()) { main.innerHTML = `<div class="loading">Opening the books…</div>`; return; }
  const banner = S.mode === "demo"
    ? (S.txs.some(t => t.example) ? `<div class="banner"><strong>Example data loaded.</strong> These are sample books for a 40-child home. When you're ready, go to Settings and remove the example data, then enter your own accounts.</div>` : "")
    : !S.canWrite ? `<div class="banner"><strong>View only.</strong> You can read these books. Ask the owner for Contributor or Editor access to make entries.</div>` : "";
  const scrollY = window.scrollY;
  main.innerHTML = banner + ({ overview: vOverview, transactions: vTransactions, donors: vDonors, budget: vBudget, reports: vReports, history: vHistory, settings: vSettings }[S.view])();
  if (S.view === "transactions") updateTxTable();
  window.scrollTo(0, scrollY);
  animateValues();
}

/* ---------- Overview ---------- */
function periodRange() {
  if (S.period === "month") return monthRange(0);
  if (S.period === "fy") return fyRange(fyOf(todayISO()));
  return ["", ""];
}
function vOverview() {
  const [a, b] = periodRange();
  const list = S.txs.filter(t => inRange(t.date, a, b));
  const inc = sum(list.filter(t => t.type === "income")), exp = sum(list.filter(t => t.type === "expense"));
  const accs = allAccounts();
  const total = sum(accs, x => accountBalance(x));
  const periodName = { month: MONTHS[new Date().getMonth()] + " " + new Date().getFullYear(), fy: "FY " + fyLabel(fyOf(todayISO())), all: "All time" }[S.period];
  // cost per child per month over the last 3 complete-ish months
  const [c0] = monthRange(-2), [, c1] = monthRange(0);
  const last3 = sum(S.txs.filter(t => t.type === "expense" && inRange(t.date, c0, c1)));
  const perChild = S.settings.children > 0 ? last3 / 3 / S.settings.children : 0;
  const fcraIn = sum(list.filter(t => t.type === "income" && t.fcra));
  const empty = S.txs.length === 0;

  const head = `<div class="head"><div><h1>Overview</h1><p>${esc([S.settings.orgName, S.settings.children ? S.settings.children + " children in care" : ""].filter(Boolean).join(" · "))}</p></div>
    <div class="head-actions">
      <div class="seg" role="group" aria-label="Period">${[["month", "This month"], ["fy", "This FY"], ["all", "All time"]].map(([k, l]) => `<button data-period="${k}" aria-pressed="${S.period === k}">${l}</button>`).join("")}</div>
      ${S.canWrite ? `<button class="btn primary" data-act="new-tx">+ New entry</button>` : ""}
    </div></div>`;
  if (empty) return head + `<div class="panel"><div class="empty"><h2>No entries yet</h2><p>Every donation you receive and every rupee you spend goes here. Start with today's cash in hand and bank balances in Settings, then record your first entry.</p><div class="head-actions">${S.canWrite ? `<button class="btn primary" data-act="new-tx">+ Record first entry</button><button class="btn" data-view="settings">Set opening balances</button>` : ""}</div></div></div>`;

  const pwHint = !pwOn() && canSettings() ? `<div class="banner" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span><strong>Protect these books.</strong> Turn on an entry password for staff and an admin password for changes and deletions.</span><button class="btn small" data-view="settings">Set up passwords</button></div>` : "";
  const kpis = pwHint + `<div class="kpis">
    <div class="kpi lead"><span class="label">Money on hand</span><span class="value"${av("total", total)}>${money(total)}</span><span class="sub">Across ${accs.length} cash &amp; bank accounts</span></div>
    <div class="kpi"><span class="label">Received · ${esc(periodName)}</span><span class="value in"${av("inc-" + S.period, inc)}>${money(inc)}</span><span class="sub">${list.filter(t => t.type === "income").length} receipts${fcraIn ? ` · ${money(fcraIn)} FCRA` : ""}</span></div>
    <div class="kpi"><span class="label">Spent · ${esc(periodName)}</span><span class="value out"${av("exp-" + S.period, exp)}>${money(exp)}</span><span class="sub">${list.filter(t => t.type === "expense").length} payments</span></div>
    <div class="kpi"><span class="label">Cost per child / month</span><span class="value"${av("perchild", perChild)}>${money(perChild)}</span><span class="sub">Average of last 3 months</span></div>
  </div>`;

  const expCats = Object.entries(groupSum(list.filter(t => t.type === "expense"), "category")).sort((x, y) => y[1] - x[1]);
  const maxCat = expCats[0]?.[1] || 1;
  const catBars = expCats.length ? `<div class="bars">${expCats.slice(0, 8).map(([c, v]) => `<div class="bar-line"><span class="name" title="${esc(c)}">${esc(c)}</span><div class="track"><div class="fill" style="width:${(v / maxCat * 100).toFixed(1)}%"></div></div><span class="v">${money(v)}</span></div>`).join("")}</div>` : `<p class="muted">No spending recorded in this period.</p>`;

  const fundRows = fundsList().map(f => {
    const fi = sum(S.txs.filter(t => t.type === "income" && t.fund === f)), fe = sum(S.txs.filter(t => t.type === "expense" && t.fund === f));
    return `<div class="row"><span class="k">${esc(f)}<small>${money(fi)} in · ${money(fe)} out</small></span><span class="v ${fi - fe < 0 ? "out" : ""}"${av("fund-" + f, fi - fe)}>${money(fi - fe)}</span></div>`;
  }).join("");
  const accRows = accs.map(x => `<div class="row"><span class="k">${esc(x)}</span><span class="v"${av("acc-" + x, accountBalance(x))}>${money(accountBalance(x))}</span></div>`).join("");

  const recent = sortedTxs().slice(0, 7).map(t => txRowCompact(t)).join("");

  return head + kpis + `
    <div class="grid-2">
      <div class="stack">
        <section class="panel chart"><div class="panel-head"><h2>Last 12 months</h2><div class="legend"><span><i style="background:var(--accent)"></i>Received</span><span><i style="background:var(--marigold)"></i>Spent</span></div></div>${monthlyChart()}</section>
        <section class="panel"><div class="panel-head"><h2>Where the money went</h2><span class="note">${esc(periodName)}</span></div>${catBars}</section>
      </div>
      <div class="stack">
        <section class="panel"><div class="panel-head"><h2>Cash &amp; bank</h2><span class="note">Today</span></div><div class="rows">${accRows}<div class="row total"><span class="k">Total</span><span class="v"${av("acc-total", total)}>${money(total)}</span></div></div></section>
        <section class="panel"><div class="panel-head"><h2>Fund balances</h2><span class="note">Received minus spent, all time</span></div><div class="rows">${fundRows}</div></section>
        <section class="panel"><div class="panel-head"><h2>Recent entries</h2><button class="btn small ghost" data-view="transactions">All entries →</button></div><div class="rows">${recent}</div></section>
      </div>
    </div>`;
}
function txRowCompact(t) {
  const cls = t.type === "income" ? "in" : t.type === "expense" ? "out" : "xfer";
  const amt = t.type === "income" ? money(t.amount, { sign: true }) : t.type === "expense" ? money(-t.amount, { sign: true }) : money(t.amount);
  const what = t.type === "transfer" ? `${esc(t.account)} → ${esc(t.toAccount)}` : esc(t.category);
  const f = fl(t.id);
  return `<div class="row${f.c}" style="cursor:pointer;${f.s ? f.s.slice(8, -1) : ""}" data-edit="${esc(t.id)}"><span class="k">${esc(t.party || what)}<small>${fmtDate(t.date)} · ${what}</small></span><span class="v ${cls}">${amt}</span></div>`;
}
function monthlyChart() {
  const t = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(t.getFullYear(), t.getMonth() - i, 1); months.push({ key: d.getFullYear() + "-" + pad(d.getMonth() + 1), label: MONTHS[d.getMonth()], y: d.getFullYear(), inc: 0, exp: 0 }); }
  const idx = Object.fromEntries(months.map((m, i) => [m.key, i]));
  for (const x of S.txs) { const i = idx[(x.date || "").slice(0, 7)]; if (i === undefined) continue; if (x.type === "income") months[i].inc += +x.amount || 0; else if (x.type === "expense") months[i].exp += +x.amount || 0; }
  const maxV = Math.max(1, ...months.map(m => Math.max(m.inc, m.exp)));
  const mag = Math.pow(10, Math.floor(Math.log10(maxV))); const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s * 4 >= maxV) || mag * 10;
  const top = step * 4;
  const W = 640, H = 230, L = 46, R = 8, T = 10, B = 26; const pw = W - L - R, ph = H - T - B;
  const y = v => T + ph - v / top * ph; const bw = pw / 12;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money received and spent per month, last 12 months">`;
  for (let k = 0; k <= 4; k++) { const v = step * k; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${compact(v)}</text>`; }
  months.forEach((m, i) => {
    const x0 = L + i * bw + bw * 0.14, w = bw * 0.34;
    s += `<rect x="${x0}" y="${y(m.inc)}" width="${w}" height="${Math.max(0, T + ph - y(m.inc))}" rx="2" fill="var(--accent)"><title>${m.label} ${m.y}: received ${money(m.inc)}</title></rect>`;
    s += `<rect x="${x0 + w + 2}" y="${y(m.exp)}" width="${w}" height="${Math.max(0, T + ph - y(m.exp))}" rx="2" fill="var(--marigold)"><title>${m.label} ${m.y}: spent ${money(m.exp)}</title></rect>`;
    s += `<text class="axis" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${m.label}</text>`;
  });
  return s + `</svg>`;
}

async function submitTx(id, then, clicked) {

async function downloadReceiptPdf(id, btn) {
  const t = S.txs.find(x => x.id === id); if (!t) return;

      doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(...muted).text(pdfText("Date: " + fmtDate(t.date)), x + w - pad, top + 58, { align: "right" });
      doc.setDrawColor(...ink).setLineWidth(1.2).line(x + pad, top + 70, x + w - pad, top + 70);
      const rows = [["Received with thanks from", (d?.name || t.party || "-")], ...(d?.address ? [["Address", d.address]] : []), ...(d?.pan ? [["Donor PAN", d.pan]] : []),
        ["The sum of", pdfMoney(t.amount)], ["In words", amountInWords(t.amount)], ["By", (t.mode || "-") + (t.ref ? ` (ref. ${t.ref})` : "")],

      let y = top + 92;

        const big = k === "The sum of";

        const lines = doc.splitTextToSize(pdfText(v), w - pad * 2 - 150);

      }

      doc.setFont("helvetica", "normal").setFontSize(8).setTextColor(...muted).text(doc.splitTextToSize(pdfText(s.taxNote), 200), x + pad, fy - 14);
      doc.setDrawColor(154, 166, 160).setLineDashPattern([3, 2], 0).rect(x + w - pad - 250, fy - 50, 70, 46); doc.setLineDashPattern([], 0);
      doc.setFontSize(7.5).text("Seal", x + w - pad - 215, fy - 24, { align: "center" });
      doc.setDrawColor(...ink).setLineWidth(0.6).line(x + w - pad - 160, fy, x + w - pad, fy);

/* ---------- Budget ---------- */
function vBudget() {
  const curFy = fyOf(todayISO()); const fy = S.budgetFy ?? curFy;
  const amounts = S.budgets[fy] || {};
  const [a, b] = fyRange(fy);
  const today = todayISO();
  let monthsElapsed = 12;
  if (fy === curFy) { const [ty, tm] = today.split("-").map(Number); monthsElapsed = ((ty - fy) * 12 + tm - S.settings.fyStart) + 1; }
  else if (a > today) monthsElapsed = 0;
  const spent = groupSum(S.txs.filter(t => t.type === "expense" && inRange(t.date, a, b)), "category");
  const rows = catsFor("expense").map(c => {
    const mb = Number(amounts[c]) || 0; const ytdB = mb * monthsElapsed; const sp = spent[c] || 0;
    const pct = ytdB ? sp / ytdB : (sp ? 9 : 0);

    return { c, mb, ytdB, sp, pct, state };
  });
  const totB = sum(rows, r => r.ytdB), totS = sum(rows, r => r.sp), totM = sum(rows, r => r.mb);
  const fys = [curFy - 1, curFy, curFy + 1];

    ${S.budgetMeta[fy]?.at ? `<div class="role-note">Budget last set by ${esc(who(S.budgetMeta[fy].by) || "Someone")} on ${fmtStamp(S.budgetMeta[fy].at)}</div>` : ""}

    ${rows.map(r => `<tr><td>${esc(r.c)}</td><td class="amt"><input type="number" min="0" step="100" class="num" data-budget="${esc(r.c)}" id="b-${esc(r.c.replace(/[^a-z0-9]/gi, ""))}" value="${r.mb || ""}" placeholder="0" style="width:120px;text-align:right" ${canEdit() ? "" : "disabled"} aria-label="Monthly budget for ${esc(r.c)}"></td>

    </tbody><tfoot><tr><td>Total</td><td class="amt num">${money(totM)}</td><td class="amt num">${money(totB)}</td><td class="amt num">${money(totS)}</td><td colspan="2"></td></tr></tfoot></table></div>`;

/* ---------- Reports ---------- */
function reportRange() {
  const r = S.report; const fy = fyOf(todayISO());
  if (r.preset === "month") return monthRange(0);
  if (r.preset === "lastmonth") return monthRange(-1);
  if (r.preset === "fy") return fyRange(fy);
  if (r.preset === "lastfy") return fyRange(fy - 1);
  return [r.from || "0000-01-01", r.to || "9999-12-31"];
}
function reportData() {
  const [a, b] = reportRange();
  const list = S.txs.filter(t => inRange(t.date, a, b));
  const inc = list.filter(t => t.type === "income"), exp = list.filter(t => t.type === "expense");
  const dayBefore = (() => { const d = new Date(a + "T00:00:00"); d.setDate(d.getDate() - 1); return isoOf(d); })();
  const accs = allAccounts().map(acc => {
    const open = a > "0000-01-01" ? accountBalance(acc, dayBefore) : Number(S.settings.openingBalances?.[acc]) || 0;
    const rec = sum(list.filter(t => (t.type === "income" && t.account === acc) || (t.type === "transfer" && t.toAccount === acc)));
    const pay = sum(list.filter(t => (t.type === "expense" && t.account === acc) || (t.type === "transfer" && t.account === acc)));
    return { acc, open, rec, pay, close: open + rec - pay };
  });
  const funds = fundsList().map(f => ({ f, i: sum(inc.filter(t => t.fund === f)), e: sum(exp.filter(t => t.fund === f)) }));
  return { a, b, list, inc, exp, incCats: Object.entries(groupSum(inc, "category")).sort((x, y) => y[1] - x[1]), expCats: Object.entries(groupSum(exp, "category")).sort((x, y) => y[1] - x[1]), accs, funds, fcra: inc.filter(t => t.fcra) };
}

      ${r.preset === "custom" ? `<input type="date" id="r-from" value="${esc(r.from)}" aria-label="From"><input type="date" id="r-to" value="${esc(r.to)}" aria-label="To">` : ""}

  if (S.settings.updatedAt) ev.push({ e: { at: S.settings.updatedAt, by: S.settings.updatedBy, action: "settings" }, kind: "settings" });
  for (const c of S.customCats) if (c.createdAt) ev.push({ e: { at: c.createdAt, by: c.createdBy, action: "category" }, kind: "category", rec: c });
  for (const [fy, m] of Object.entries(S.budgetMeta)) if (m.at) ev.push({ e: { at: m.at, by: m.by, action: "budget" }, kind: "budget", fy: +fy });
  ev.sort((a, b) => b.e.at - a.e.at);
  const people = [...new Set(ev.map(x => x.e.by).filter(Boolean))];
  const f = S.hf;
  const list = ev.filter(x => (!f.who || x.e.by === f.who) && (!f.action || x.e.action === f.action || (f.action === "other" && (x.kind === "settings" || x.kind === "budget" || x.kind === "category"))));

  };
  const today = todayISO(); const [m0] = monthRange(0);
  const monthAdds = {}; for (const t of S.txs) if (t.createdBy && t.createdAt && isoOf(new Date(t.createdAt)) >= m0) monthAdds[t.createdBy] = (monthAdds[t.createdBy] || 0) + 1;
  const delRows = [...S.deletedTxs.map(t => ({ kind: "tx", r: t })), ...S.deletedDonors.map(d => ({ kind: "donor", r: d }))].sort((a, b) => (b.r.deletedAt || 0) - (a.r.deletedAt || 0));
  return `<div class="head"><div><h1>History</h1><p>Who added, changed or deleted what, and when. Deleted entries are kept here and can be restored by the owner.</p></div></div>
    ${Object.keys(monthAdds).length ? `<div class="filters">${Object.entries(monthAdds).sort((a, b) => b[1] - a[1]).map(([id, n]) => `<span class="chip good">${esc(who(id))}: ${n} entr${n === 1 ? "y" : "ies"} this month</span>`).join("")}</div>` : ""}
    <div class="filters">
      <select id="h-who" aria-label="Person"><option value="">Everyone</option>${people.map(p => `<option value="${esc(p)}" ${f.who === p ? "selected" : ""}>${esc(who(p))}</option>`).join("")}</select>
      <select id="h-action" aria-label="Change"><option value="">All changes</option>${[["created", "Added"], ["edited", "Edited"], ["deleted", "Deleted"], ["restored", "Restored"], ["other", "Settings, budget & categories"]].map(([k, l]) => `<option value="${k}" ${f.action === k ? "selected" : ""}>${l}</option>`).join("")}</select>

    <section class="panel"><div class="panel-head"><h2>Deleted entries</h2><span class="note">${delRows.length ? delRows.length + " kept, not counted in any total" : "Nothing deleted"}</span></div>

async function submitSettings() {
  const lines = id => $(id).value.split("\n").map(x => x.trim()).filter(Boolean);
  const accounts = lines("#s-accounts");
  const ob = {}; document.querySelectorAll("[data-ob]").forEach(el => { ob[el.dataset.ob] = parseFloat(el.value) || 0; });
  for (const a of accounts) if (!(a in ob)) ob[a] = Number(S.settings.openingBalances?.[a]) || 0;
  const cur = $("#s-currency").value.trim().toUpperCase() || "INR";
  try { new Intl.NumberFormat("en", { style: "currency", currency: cur }); } catch { return toast(`"${cur}" isn't a currency code. Use a 3-letter code like INR or USD.`); }

const MONTH_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function monthData(ym) {
  const [y, m] = ym.split("-").map(Number);
  const a = `${ym}-01`, b = isoOf(new Date(y, m, 0)), dayBefore = isoOf(new Date(y, m - 1, 0));
  const list = S.txs.filter(t => inRange(t.date, a, b)).sort((p, q) => p.date.localeCompare(q.date) || (p.createdAt || 0) - (q.createdAt || 0));
  const inc = list.filter(t => t.type === "income"), exp = list.filter(t => t.type === "expense"), xfer = list.filter(t => t.type === "transfer");
  const accs = allAccounts().map(acc => {
    const open = accountBalance(acc, dayBefore);
    const rec = sum(list.filter(t => (t.type === "income" && t.account === acc) || (t.type === "transfer" && t.toAccount === acc)));
    const pay = sum(list.filter(t => (t.type === "expense" && t.account === acc) || (t.type === "transfer" && t.account === acc)));
    return { acc, open, rec, pay, close: open + rec - pay };
  });
  const upTo = (type, f) => sum(S.txs.filter(t => t.type === type && t.fund === f && t.date <= b));
  const funds = fundsList().map(f => ({ f, i: sum(inc.filter(t => t.fund === f)), e: sum(exp.filter(t => t.fund === f)), bal: upTo("income", f) - upTo("expense", f) }));
  const budget = S.budgets[fyOf(a)] || {}; const spent = groupSum(exp, "category");
  const budgetRows = catsFor("expense").filter(c => Number(budget[c]) || spent[c]).map(c => ({ c, b: Number(budget[c]) || 0, s: spent[c] || 0 }));
  const receipts = inc.map(t => t.receiptNo).filter(Boolean).sort();
  const ti = sum(inc), te = sum(exp);
  return { ym, label: `${MONTH_FULL[m - 1]} ${y}`, a, b, list, inc, exp, xfer, accs, funds, budgetRows, receipts, ti, te,
    incCats: Object.entries(groupSum(inc, "category")).sort((p, q) => q[1] - p[1]),
    expCats: Object.entries(groupSum(exp, "category")).sort((p, q) => q[1] - p[1]),
    fcra: inc.filter(t => t.fcra),
    open: sum(accs, x => x.open), close: sum(accs, x => x.close),
    perChild: S.settings.children > 0 ? te / S.settings.children : 0 };
}

    doc.autoTable({ ...base, startY: y, styles: { ...base.styles, fontSize: 7.5, cellPadding: 3 }, head: [["Date", "Particulars", "Category · Fund", "Account", "Receipt / Ref", "Received", "Paid"]],
      body: rows.length ? rows.map(t => [fmtDate(t.date), pdfText((t.party || "-") + (t.fcra ? " (FCRA)" : "")), pdfText(t.category + (t.fund ? " · " + t.fund : "")), pdfText(t.account), pdfText(t.receiptNo || t.ref || ""), t.type === "income" ? pdfMoney(t.amount) : "", t.type === "expense" ? pdfMoney(t.amount) : ""]) : [["", "No entries this month", "", "", "", "", ""]],
      foot: [[{ content: `${R.inc.length} receipts · ${R.exp.length} payments`, colSpan: 5 }, pdfMoney(R.ti), pdfMoney(R.te)]], ...right([5, 6], { 5: 66, 6: 66 }), columnStyles: { 0: { cellWidth: 52 }, 4: { cellWidth: 70 }, 5: { halign: "right", cellWidth: 66 }, 6: { halign: "right", cellWidth: 66 } } });
    if (R.xfer.length) {
      y = doc.lastAutoTable.finalY + 10;
      doc.autoTable({ ...base, startY: y, styles: { ...base.styles, fontSize: 7.5, cellPadding: 3 }, head: [["Date", "Transfer between accounts", "From", "To", "Amount"]], body: R.xfer.map(t => [fmtDate(t.date), pdfText(t.party || "Transfer"), pdfText(t.account), pdfText(t.toAccount), pdfMoney(t.amount)]), ...right([4], { 4: 70 }), columnStyles: { 0: { cellWidth: 52 }, 4: { halign: "right", cellWidth: 70 } } });
    }
    y = doc.lastAutoTable.finalY + 18;
    if (R.fcra.length) { doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...ink).text(pdfText(`Foreign contributions (FCRA): ${pdfMoney(sum(R.fcra))} received in ${R.fcra.length} remittance(s), credited to the FCRA designated account.`), M, y); y += 14; }
    if (y > H - 90) { doc.addPage(); y = 60; }
    y += 40; const gap = 16, sw = (W - 2 * M - gap * 3) / 4;
    ["Prepared by", "Checked by", "Treasurer", "Secretary / President"].forEach((t, i) => { const x = M + i * (sw + gap); doc.setDrawColor(...ink).setLineWidth(0.6).line(x, y, x + sw, y); doc.setFontSize(8).setTextColor(...muted).text(t, x + sw / 2, y + 11, { align: "center" }); });
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(7.5).setTextColor(122, 135, 129).text(pdfText(`${s.orgName} · ${R.label} · Generated ${fmtDate(todayISO())}`), M, H - 22).text(`Page ${i} of ${pages}`, W - M, H - 22, { align: "right" }); }
    const name = `${(s.orgName || "home").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "")}-report-${R.ym}.pdf`;
    await offerFile(name, doc.output("blob"), "application/pdf");
  } catch (e) {
    console.error(e); toast("Couldn't make the PDF. Check your internet connection and try again.");
  } finally { btn.disabled = false; btn.innerHTML = label; }
}

/* ---------- modal ---------- */
function openModal(title, body, foot, wide) {
  $("#modal-root").innerHTML = `<div class="overlay" data-overlay><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head"><h2 id="m-title">${title}</h2><button class="btn ghost small" data-act="close" aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div></div>`;
}
function closeModal() {
  const ov = $("#modal-root .overlay"); if (!ov) return;
  if (reduceMotion) { $("#modal-root").innerHTML = ""; return; }
  ov.classList.add("closing"); setTimeout(() => { if (ov.isConnected) ov.remove(); }, 180);
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-view],[data-period],[data-preset],[data-fy],[data-act],[data-edit],[data-donor]");
  if (!el) { if (e.target.matches("[data-lock-overlay]")) closeUnlock(); else if (e.target.matches("[data-overlay]")) closeModal(); return; }
  // what each action needs once passwords are on: 1 = entry password, 2 = admin password
  const NEED = { "new-tx": 1, "new-tx-donor": 1, "new-donor": 1, "quick-add": 1, "budget-add-cat": 1, "budget-add-save": 1, "add-cat": 1, "new-list": 1,
    "save-tx": el.dataset.id ? 2 : 1, "save-donor": el.dataset.id ? 2 : 1, "edit-donor": 2, "del-tx": 2, "del-donor": 2, "restore-tx": 2, "restore-donor": 2,
    "remove-cat": 2, "save-budget": 2, "save-settings": 2, "clear-examples": 2, "pw-change": 2, "pw-newkey": 2, "pw-off": 2 };
  const need = NEED[el.dataset.act];
  if (need && S.canWrite && lvl() < need && !el.closest("#lock-root")) { e.preventDefault(); return openUnlock(need, () => el.isConnected && el.click()); }
  if (el.dataset.view) { S.view = el.dataset.view; closeModal(); window.scrollTo(0, 0); return render(); }
  if (el.dataset.period) { S.period = el.dataset.period; return render(); }
  if (el.dataset.preset) { S.report.preset = el.dataset.preset; return render(); }
  if (el.dataset.fy && !el.dataset.act) { S.budgetFy = +el.dataset.fy; return render(); }
  if (el.dataset.edit) { const t = S.txs.find(x => x.id === el.dataset.edit); if (t) txForm(t); return; }
  if (el.dataset.donor) return donorDetail(el.dataset.donor);
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "close": return closeModal();
    case "lock-toggle": if (S.level > 0) { setLevel(0); toast("Locked"); } else openUnlock(1, null); return;
    case "unlock": return openUnlock(+el.dataset.need || 1, null);
    case "unlock-edit": return openUnlock(2, () => { const t = S.txs.find(x => x.id === id); if (t) txForm(t); });
    case "pw-cancel": return closeUnlock();
    case "pw-submit": return submitUnlock(+el.dataset.need || 1, el);
    case "pw-forgot": { const then = unlockThen; openUnlock(+el.dataset.need || 1, then, "forgot"); return; }
    case "pw-back": { const then = unlockThen; openUnlock(+el.dataset.need || 1, then); return; }
    case "pw-reset": return submitReset(el);
    case "pw-setup": return submitPasswords("setup", el);
    case "pw-change": return submitPasswords("change", el);
    case "pw-newkey": return submitPasswords("new-key", el);
    case "pw-off":
      if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Yes, turn passwords off"; return; }
      return submitPasswords("off", el);
    case "copy-rk": try { await navigator.clipboard.writeText(el.dataset.key); toast("Recovery key copied", true); } catch { const r = document.createRange(); r.selectNodeContents($("#rk-show")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Key selected. Press Ctrl+C to copy."); } return;
    case "new-tx": return txForm();
    case "new-tx-donor": { const d = S.donors.find(x => x.id === id); txForm(); if (d) { $("#tx-donor").value = d.id; $("#tx-party").value = d.name; } return; }
    case "save-tx": return submitTx(id, el.dataset.then, el);
    case "del-tx":
      if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Confirm delete"; return; }
      try { await delTx(id); closeModal(); toast("Entry deleted. The owner can restore it from History."); } catch (err) { writeFailed(err); } return;
    case "receipt": return showReceipt(id);
    case "rc-print": { const t = S.txs.find(x => x.id === id); if (t) printHtml(receiptSheet(t, S.rcOffice)); return; }
    case "rc-pdf": return downloadReceiptPdf(id, el);
    case "monthly-report": return openMonthlyReport();
    case "mr-prev": return setReportMonth(shiftMonth(S.reportMonth, -1));
    case "mr-next": return setReportMonth(shiftMonth(S.reportMonth, 1));
    case "mr-print": return printReport();
    case "mr-pdf": return downloadReportPdf(el);
    case "new-list": return $(".modal").showNew(el.dataset.kind);
    case "add-cat": {
      const m = $(".modal"); const kind = $("#tx-newcat").dataset.kind;
      try {
        const name = await quickAdd(kind === "fund" ? "fund" : m.dataset.type, $("#tx-newcat-name").value);
        if (!name) return;
        if (kind === "fund") { m.refreshFunds(name); m.lastFund = name; } else m.refreshCats(name);
        $("#tx-newcat").hidden = true;
      } catch (err) { writeFailed(err); }
      return;
    }
    case "cancel-cat": {
      const m = $(".modal"); const p = $("#tx-newcat"); p.hidden = true;
      if (p.dataset.kind === "fund") { if ($("#tx-fund").value === "__new") m.refreshFunds(m.lastFund); }
      else if ($("#tx-category").value === "__new") m.refreshCats(catsFor(m.dataset.type)[0]);
      return;
    }
    case "quick-add": {
      try { const name = await quickAdd($("#qa-type").value, $("#qa-name").value); if (name) { $("#qa-name").value = ""; $("#main").dataset.view = ""; render(); } } catch (err) { writeFailed(err); }
      return;
    }
    case "budget-add-cat": {
      openModal("Add expense category", `<label class="field"><span>Name</span><input type="text" id="bm-name" maxlength="60" placeholder="For example: Gas cylinder, Computer classes, Hostel repairs"></label><p class="muted" style="margin:0;font-size:.82rem">It appears in the budget table and in the category list for everyone making entries.</p>`,
        `<div class="right"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="budget-add-save">Add category</button></div>`);
      setTimeout(() => $("#bm-name")?.focus(), 30); return;
    }
    case "budget-add-save": {
      try { const name = await quickAdd("expense", $("#bm-name").value); if (name) closeModal(); } catch (err) { writeFailed(err); }
      return;
    }
    case "remove-cat": try { await removeCategory(id); toast("Removed from the list. Past entries keep it."); } catch (err) { writeFailed(err); } return;
    case "restore-tx": try { await restoreTx(id); toast("Entry restored"); } catch (err) { writeFailed(err); } return;
    case "restore-donor": try { await restoreDonor(id); toast("Donor restored"); } catch (err) { writeFailed(err); } return;
    case "copy-receipt": {
      const t = S.txs.find(x => x.id === id); const text = receiptText(t, S.allDonors.find(x => x.id === t.donorId));
      try { await navigator.clipboard.writeText(text); toast("Receipt copied"); }
      catch { const r = document.createRange(); r.selectNodeContents($("#receipt")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Receipt selected. Press Ctrl+C or Cmd+C to copy."); }
      return;
    }
    case "new-donor": return donorForm();
    case "edit-donor": return donorForm(S.donors.find(x => x.id === id));
    case "save-donor": return submitDonor(id);
    case "del-donor": {
      if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Confirm delete"; return; }
      try { await delDonor(id); closeModal(); toast("Donor deleted. Their donations stay in the books, and the donor can be restored from History."); } catch (err) { writeFailed(err); } return;
    }
    case "clear-filters": S.tf = { q: "", type: "", category: "", fund: "", account: "", from: "", to: "" }; return render();
    case "save-budget": {
      const amounts = {}; document.querySelectorAll("[data-budget]").forEach(i => { const v = parseFloat(i.value); if (v > 0) amounts[i.dataset.budget] = v; });
      try { await saveBudget(+el.dataset.fy, amounts); toast("Budget saved"); } catch (err) { writeFailed(err); } return;
    }
    case "save-settings": return submitSettings();
    case "clear-examples":
      if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Yes, remove all example records"; return; }
      return clearExamples();
    case "backup": return offerFile(`home-ledger-backup-${todayISO()}.json`, JSON.stringify({ app: "home-ledger", version: 2, settings: S.settings, txs: S.allTxs, donors: S.allDonors, budgets: S.budgets, budgetMeta: S.budgetMeta, customCats: S.customCats }, null, 1), "application/json");
    case "csv-tx": return offerFile(`transactions-${todayISO()}.csv`, txCsv(filteredTxs()));
    case "csv-report": { const [a, b] = reportRange(); return offerFile(`statement-${a}-to-${b}.csv`.replace(/0000-01-01|9999-12-31/g, "all"), reportCsv()); }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "f-q") { S.tf.q = e.target.value; updateTxTable(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  const map = { "f-type": "type", "f-category": "category", "f-fund": "fund", "f-account": "account", "f-from": "from", "f-to": "to" };
  if (map[id]) { S.tf[map[id]] = e.target.value; updateTxTable(); return; }
  if (id === "mr-month" && /^\d{4}-\d{2}$/.test(e.target.value)) { setReportMonth(e.target.value); return; }
  if (id === "rc-office") { S.rcOffice = e.target.checked; const t = S.txs.find(x => x.id === $('[data-act="rc-pdf"]')?.dataset.id); if (t) $("#receipt").innerHTML = receiptPaper(t, S.rcOffice ? "Donor copy" : ""); return; }
  if (id === "h-who" || id === "h-action") { S.hf[id === "h-who" ? "who" : "action"] = e.target.value; $("#main").dataset.view = ""; render(); return; }
  if (id === "restore-file" && e.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try { const d = JSON.parse(fr.result); if (!Array.isArray(d.txs)) throw 0; applyData(d); persist(); render(); toast(`Restored ${S.txs.length} entries and ${S.donors.length} donors`); }
      catch { toast("That file isn't a Home Ledger backup. Choose the .json file made by Download backup."); }
    };
    fr.readAsText(e.target.files[0]); e.target.value = ""; return;
  }
  if (id === "r-from") { S.report.from = e.target.value; render(); }
  if (id === "r-to") { S.report.to = e.target.value; render(); }
  if (id === "tx-date" && $("#tx-receipt") && !$(".modal [data-act='del-tx']")) $("#tx-receipt").value = nextReceiptNo(e.target.value);
});
document.addEventListener("focusout", () => setTimeout(() => { if (S.pending && !$("#main").contains(document.activeElement)) render(); }, 0));
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "pw-input") { e.preventDefault(); $('[data-act="pw-submit"]').click(); return; }
  if (e.key === "Enter" && (e.target.id === "rk-admin" || e.target.id === "rk-entry" || e.target.id === "rk-key")) { e.preventDefault(); $('[data-act="pw-reset"]').click(); return; }
  if (e.key === "Escape" && $("#lock-root").innerHTML) { closeUnlock(); return; }
  if (e.key === "Enter" && e.target.id === "qa-name") { e.preventDefault(); $('[data-act="quick-add"]').click(); return; }
  if (e.key === "Enter" && e.target.id === "bm-name") { e.preventDefault(); $('[data-act="budget-add-save"]').click(); return; } if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal(); });

boot();
</script>
